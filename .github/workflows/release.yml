name: Release Flatpak

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1b74b57fa75e61b217e90072aec7ba7d618613fea982106cb3e813c002662162
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Build Flatpak repository
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          manifest-path: flatpak/io.github.crhy.SpacedRGB.json
          build-dir: build-dir
          branch: stable
          repo-dir: spaced-rgb-repo
          build-bundle: false
          upload-artifact: false
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Verify packaged dependencies without opening hardware
        run: flatpak-builder --run build-dir flatpak/io.github.crhy.SpacedRGB.json python3 scripts/verify-flatpak.py
      - name: Create updateable release bundle
        run: |
          mkdir -p dist
          flatpak build-bundle --arch=x86_64 --repo-url=https://crhy.github.io/spacedbazaar/flatpak-repo/ --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo spaced-rgb-repo "dist/SpacedRGB-$(cat VERSION)-x86_64.flatpak" io.github.crhy.SpacedRGB stable
          cd dist
          sha256sum *.flatpak > SHA256SUMS
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spaced-rgb-flatpak
          path: dist/*
          compression-level: 0
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: Spaced RGB ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: dist/*
